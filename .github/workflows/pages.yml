# Builds catalog.json + thumbnails + FREE lesson zips and publishes them with GitHub Pages.
# Repo setting needed once: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish lesson catalog
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 tools/build_catalog.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
